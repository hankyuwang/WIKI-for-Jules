name: Jules
on:
  issue_comment:
    types: [created]

jobs:
  jules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Jules
        if: ${{ contains(fromJSON('["hankyuwang"]'), github.event.issue.user.login) }}
        uses: google-labs-code/jules-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
